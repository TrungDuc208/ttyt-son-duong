<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - Trung tâm Y tế khu vực Sơn Dương</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <div class="page-head">
    <div class="container">
      <h2>Liên hệ</h2>
      <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Liên hệ</div>
    </div>
  </div>

  <section class="block">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-card" id="contact-info"></div>
        <div class="contact-card">
          <h4>Gửi câu hỏi / góp ý</h4>
          <form id="contact-form">
            <div style="display:grid;gap:12px">
              <div>
                <label class="fld">Họ tên <span class="req">*</span></label>
                <input required placeholder="Họ và tên của bạn">
              </div>
              <div>
                <label class="fld">Số điện thoại hoặc email <span class="req">*</span></label>
                <input required placeholder="Để Trung tâm phản hồi">
              </div>
              <div>
                <label class="fld">Nội dung <span class="req">*</span></label>
                <textarea rows="5" required placeholder="Câu hỏi, góp ý về chất lượng dịch vụ..."></textarea>
              </div>
              <button class="btn btn-blue" type="submit">Gửi liên hệ</button>
            </div>
          </form>
        </div>
      </div>
      <div class="map-placeholder" style="margin-top:24px">
        🗺️ Bản đồ vị trí Trung tâm (bản chính thức sẽ nhúng Google Maps tại đây)
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/his-adapter.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
