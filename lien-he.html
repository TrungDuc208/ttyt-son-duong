<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - Trung tâm Y tế khu vực Sơn Dương</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <div class="page-head">
    <div class="container">
      <h2>Liên hệ</h2>
      <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Liên hệ</div>
    </div>
  </div>

  <section class="block">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-card" id="contact-info"></div>
        <div class="contact-card">
          <h4>Gửi câu hỏi / góp ý</h4>
          <form id="contact-form">
            <div style="display:grid;gap:12px">
              <div>
                <label class="fld">Họ tên <span class="req">*</span></label>
                <input required placeholder="Họ và tên của bạn">
              </div>
              <div>
                <label class="fld">Số điện thoại hoặc email <span class="req">*</span></label>
                <input required placeholder="Để Trung tâm phản hồi">
              </div>
              <div>
                <label class="fld">Nội dung <span class="req">*</span></label>
                <textarea rows="5" required placeholder="Câu hỏi, góp ý về chất lượng dịch vụ..."></textarea>
              </div>
              <button class="btn btn-blue" type="submit">Gửi liên hệ</button>
            </div>
          </form>
        </div>
      </div>
      <div class="map-embed" style="margin-top:24px">
        <iframe
          src="https://www.google.com/maps?q=21.694608,105.396281&hl=vi&z=16&output=embed"
          title="Bản đồ Trung tâm Y tế khu vực Sơn Dương"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        <a class="map-link" href="https://www.google.com/maps/place/21%C2%B041'40.6%22N+105%C2%B023'46.6%22E/@21.6949807,105.3965362,16z"
           target="_blank" rel="noopener">📍 Mở chỉ đường trên Google Maps →</a>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/his-adapter.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
